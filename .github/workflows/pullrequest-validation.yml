            const fs = require('fs');
            const outdated = fs.readFileSync('outdated.json', 'utf8');
            const result = JSON.parse(outdated);

            let comment = '## Outdated dependencies found:\n\n';
            for (const [name, info] of Object.entries(result)) {
              comment += `- ${name} (${info.current} -> ${info.wanted} -> ${info.latest})\n`;
            }

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.error('Error commenting on pull request:', error);
              throw error;
