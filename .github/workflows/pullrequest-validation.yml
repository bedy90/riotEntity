# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable
# packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: 'Bedy90 - Riot Entity - PullRequest Check'
on:
  pull_request:
    branches: [ "dev", "prod" ]

# If using a dependency submission action in this workflow this permission will need to be set to:
#
# permissions:
#   contents: write
#
# https://docs.github.com/en/enterprise-cloud@latest/code-security/supply-chain-security/understanding-your-software-supply-chain/using-the-dependency-submission-api
permissions:
  contents: read
  # Write permissions for pull-requests are required for using the `comment-summary-in-pr` option, comment out if you aren't using this option
  pull-requests: write

jobs:       
  eslint-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        # language: [ 'javascript', 'typescript' ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4.0.2
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run eslint
      continue-on-error: false  # Arrête le workflow si le lint échoue      

  build:
    runs-on: ubuntu-latest
    needs: eslint-review
    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4.0.2
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci
      
    - name: Run build
      run: npm run compile:npx
      continue-on-error: false  # Arrête le workflow si le build échoue


  verify:
    runs-on: ubuntu-latest
    needs: [eslint-review, build]
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
    
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}
    
      - name: Install dependencies
        run: npm ci
          
      - name: Run audit
        run: npm audit --audit-level=high
        continue-on-error: false  # Arrête le workflow si le build échoue
      
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
  
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

            
