# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable
# packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: 'Bedy90 - Riot Entity - PullRequest Check'
on:
  pull_request:
    branches: [ "dev", "prod" ]

permissions:
  contents: read
  # Write permissions for pull-requests are required for using the `comment-summary-in-pr` option, comment out if you aren't using this option
  pull-requests: write
  security-events: write

jobs:   
  # -----------------------------------------
  # Linter validation
  # -----------------------------------------    
  eslint-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        # language: [ 'javascript', 'typescript' ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4.0.2
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run eslint
      continue-on-error: false  # Arrête le workflow si le lint échoue      

  # -----------------------------------------
  # Build validation
  # -----------------------------------------      
  build:
    runs-on: ubuntu-latest
    needs: eslint-review
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4.0.2
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci
      
    - name: Run build tsup
      run: npm run build:tsup_pack
      # run: npm run build:tsc
      continue-on-error: false  # Arrête le workflow si le build échoue

  # -----------------------------------------
  # NPM AUDIT
  # -----------------------------------------
  audit_solution:
    runs-on: ubuntu-latest
    needs: [eslint-review] #, build]
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
    
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}
    
      - name: Install dependencies
        run: npm ci
 
      - name: Run audit
        run: npm audit --audit-level=high
        continue-on-error: false  # Arrête le workflow si le build échoue
      
  # -----------------------------------------
  # Outdated validation
  # -----------------------------------------
  outdated_package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
    
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}
    
      - name: Install dependencies
        run: npm ci

      - name: Check outdated dependencies
        id: outdated
        run: |
          npm outdated --json > outdated.json || true          
        shell: bash -e {0}
        continue-on-error: true  # Continuer en cas d'erreur pour diagnostiquer

      # - name: show detail
      #   run: ls -l

      - name: Install dependencies
        run: npm install mustache
  
      - name: Comment on Pull Request
        if: steps.outdated.outcome == 'success'
        uses: actions/github-script@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Read JSON
            const fs = require('fs');
            const outdated = fs.readFileSync('outdated.json', 'utf8');
            const result = JSON.parse(outdated);

            // Prepare JSON data
            const packageList = {
              data: []
            };

            Object.keys(result).forEach(depName => {
                const depInfo = result[depName];          
                packageList.data.push({name: depName, current: depInfo.current, wanted: depInfo.wanted, latest: depInfo.latest })
            });

            // Read template
            const templatePath = '.github/template/outdated.md';
            const templateFile = fs.readFileSync(templatePath, 'utf8');
            // const commentBody = renderTemplate(templateFile, packageList.data)

            const Mustache = require('mustache');
            const mustacheCommentBody = Mustache.render(templateFile, packageList);

            // Trouver le commentaire existant
            const existingComments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })
            const commentToUpdate = existingComments.data.find(c => c.user.type === 'Bot' && c.body.includes('<!-- outdated-comment -->'))
      
            try {
              if (commentToUpdate) {
                // Mettre à jour le commentaire existant
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: commentToUpdate.id,
                  body: mustacheCommentBody
                })
              } else {
                // Créer un nouveau commentaire
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: mustacheCommentBody
                })
              }
            } catch (error) {
              console.error('Error commenting on pull request:', error);
              throw error;
            }

