# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable
# packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: 'Bedy90 - Riot Entity - PullRequest Check'
on:
  pull_request:
    branches: [ "dev", "prod" ]

permissions:
  contents: read
  # Write permissions for pull-requests are required for using the `comment-summary-in-pr` option, comment out if you aren't using this option
  pull-requests: write
  security-events: write

jobs:   
  # -----------------------------------------
  # Linter validation
  # -----------------------------------------    
  eslint-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7

    - name: Execute github composite
      uses: ./.github/actions/setup-node-npm
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run lint
      run: npm run eslint
      continue-on-error: false  # Arrête le workflow si le lint échoue      

  # -----------------------------------------
  # Build validation
  # -----------------------------------------      
  build:
    runs-on: ubuntu-latest
    needs: eslint-review
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7

    - name: Execute github composite
      uses: ./.github/actions/setup-node-npm
      with:
        node-version: ${{ matrix.node-version }}
      
    - name: Run build tsup
      run: npm run build:tsup_pack
      continue-on-error: false  # Arrête le workflow si le build échoue

  # -----------------------------------------
  # NPM AUDIT
  # -----------------------------------------
  audit_solution:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
    
      - name: Execute github composite
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ matrix.node-version }}
 
      - name: Run npm audit and save result
        id: audit
        shell: bash -e {0}
        run: |
            npm audit --json > audit-result.json || true
        continue-on-error: true  # Continue même si vulnérabilités trouvées
  
      - name: Install dependencies
        run: npm install mustache
  
      - uses: actions/github-script@v5
        if: steps.audit.outcome == 'success'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
                const auditScript = require('./.github/scripts/audit.cjs');
                await auditScript({ github, context }); 
      
  # -----------------------------------------
  # Outdated validation
  # -----------------------------------------
  outdated_package:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
    
      - name: Execute github composite
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check outdated dependencies
        id: outdated
        run: |
          npm outdated --json > outdated.json || true          
        shell: bash -e {0}
        continue-on-error: true  # Continuer en cas d'erreur pour diagnostiquer

      - name: Install dependencies
        run: npm install mustache
  
      - name: Comment on Pull Request
        if: steps.outdated.outcome == 'success'
        uses: actions/github-script@v5
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: require('./.github/scripts/outdated.cjs')