# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
        
# Publish Alpha package on Github. (On publish release)
name: Bedy90 - Riot Entity - Deploy package on release published

on:   
  release:
    types: [published]

  # Manual action
  workflow_dispatch:

permissions:
   contents: read
   packages: write  
    
jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
        
    - name: Execute github composite
      uses: ./.github/actions/setup-node-npm
      with:
        node-version: ${{ matrix.node-version }}
        scope-name: '@bedy90'

    - name: Build
      id: build_process
      run: npm run build:tsup_pack

    - name: Generator prod package
      if: steps.build_process.outcome == 'success'
      run: npm run build:package

    - uses: JS-DevTools/npm-publish@v3
      id : "publishTag"
      if: steps.build_process.outcome == 'success'
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        registry: "https://npm.pkg.github.com"
        package: ./build

    - if: ${{ steps.publishTag.outputs.type }}
      run: echo "Version ${{ steps.publishTag.outputs.version }} has published !"
