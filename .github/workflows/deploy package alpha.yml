# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
        
# Publish a TAG on Github. (Manual workflow)
name: Bedy90 - Riot Entity - Deploy (Alpha)

on:   
  # Manual action
  workflow_dispatch:

permissions:
   contents: read
   packages: write  
    
jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Execute github composite
      uses: ./.github/actions/setup-node-npm
      with:
        node-version: ${{ matrix.node-version }}
        scope-name: '@bedy90'

    - name: Build
      id: build_process
      run: npm run build:tsup_pack

    - name: Generator prod package
      run: npm run build:package

    # TODO: Delete current alpha if exists
    # - name: Unpublish if exists
    #   run: |
    #     PACKAGE_NAME=$(jq -r '.name' package.json)
    #     PACKAGE_VERSION=$(jq -r '.version' package.json)
    #     if npm show $PACKAGE_NAME@$PACKAGE_VERSION ; then
    #       npm unpublish $PACKAGE_NAME@$PACKAGE_VERSION --force
    #     fi

    # https://github.com/marketplace/actions/npm-publish
    - uses: JS-DevTools/npm-publish@v3
      id : publishTag
      if: steps.build_process.outcome == 'success'
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        registry: "https://npm.pkg.github.com"
        tag: alpha # default latest 
        package: ./build

    # Publish classique via NPM
    # - name: Publish on Github NPM package
    #   working-directory: build
    #   run: npm publish
    #   env:
    #     NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - if: ${{ steps.publishTag.outputs.type }}
      run: echo "Version ${{ steps.publishTag.outputs.version }} has published !"